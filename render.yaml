services:
  # Web Service for Express API
  - type: web
    name: workout-tracker-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: workoutDB
          property: connectionString

databases:
  # Managed PostgreSQL Database
  - name: workoutDB
    plan: free
    region: oregon
    databaseName: workout_tracker
    user: workout_user

