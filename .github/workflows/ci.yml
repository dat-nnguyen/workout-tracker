name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workout_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Sync Database Schema (Test Database)
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workout_tracker_test?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/workout_tracker_test?schema=public
          JWT_SECRET: test_ci_jwt_secret_key_123456789
        run: npx dotenv -e .env.test -- prisma db push --accept-data-loss

      - name: Execute Full Test Suite
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workout_tracker_test?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/workout_tracker_test?schema=public
          JWT_SECRET: test_ci_jwt_secret_key_123456789
          JWT_EXPIRES_IN: 1h
        run: npx cross-env NODE_ENV=test NODE_OPTIONS="--experimental-vm-modules" dotenv -e .env.test -- jest --runInBand

  docker:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: workout-tracker:ci-test
